name: webgis-medical-plants

volumes:
  postgis_data:
  backend_static:

networks:
  app_network:

services:
  postgis:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_static:/app/static
    depends_on:
      postgis:
        condition: service_healthy
    ports:
        - "127.0.0.1:8080:8000"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3


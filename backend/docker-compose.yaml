volumes:
  db_data:

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: webgis-local-db
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webgis_db
    ports:
      - "5432:5432"
